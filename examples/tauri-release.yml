name: Release
run-name: Release v${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Starter release workflow for a Tauri app. Search for TODO.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true
      # Tick a target for one run, or flip its `default` to change every run.
      mac_arm64:
        description: "Build macOS arm64"
        type: boolean
        default: true
      mac_x64:
        description: "Build macOS x64"
        type: boolean
        default: false
      windows_x64:
        description: "Build Windows x64"
        type: boolean
        default: false
      linux_x64:
        description: "Build Linux x64"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build everything, but push and publish nothing"
        type: boolean
        default: false

# Only the release job gets write access.
permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      date: ${{ steps.meta.outputs.date }}
      matrix: ${{ steps.targets.outputs.matrix }}
      changelog: ${{ steps.meta.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Validate version and draft notes
        id: meta
        uses: hungdoansy/desktop-release-actions/validate-and-draft-notes@v1
        with:
          version: ${{ inputs.version }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}

      - name: Pick build targets
        id: targets
        uses: hungdoansy/desktop-release-actions/select-build-targets@v1
        with:
          selected: ${{ toJSON(inputs) }}
          targets: mac_arm64, mac_x64, windows_x64, linux_x64

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # An explicit reporter stops Vitest adding its github-actions one, which writes a
      # "Vitest Test Report" to the run summary once per package.
      - name: Test
        run: pnpm run test -- --reporter=default

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Set app version
        # TODO: stamp your app. This is enough when tauri.conf.json's `version` points at
        # package.json. Otherwise write tauri.conf.json and Cargo.toml too.
        working-directory: apps/desktop
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      # "-" ad-hoc signs the whole bundle. Without it only the binary carries a linker
      # signature, the .app fails verification, and macOS reports a downloaded copy as
      # damaged rather than offering to open it. Ignored on Windows and Linux.
      - name: Build app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: pnpm --filter TODO-your-desktop-package tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          retention-days: 1
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Update app version
        # TODO: stamp your app. This is enough when tauri.conf.json's `version` points at
        # package.json. Otherwise write tauri.conf.json and Cargo.toml too.
        working-directory: apps/desktop
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Update CHANGELOG.md
        uses: hungdoansy/desktop-release-actions/prepend-changelog-entry@v1
        with:
          file: apps/desktop/CHANGELOG.md
          tag: ${{ needs.prepare.outputs.tag }}
          date: ${{ needs.prepare.outputs.date }}
          entries: ${{ needs.prepare.outputs.changelog }}

      - name: Tag and publish
        uses: hungdoansy/desktop-release-actions/tag-and-publish-release@v1
        with:
          tag: ${{ needs.prepare.outputs.tag }}
          changelog: ${{ needs.prepare.outputs.changelog }}
          dry-run: ${{ inputs.dry_run }}
          # TODO: list the changelog and every file your version step changes.
          paths: |
            apps/desktop/CHANGELOG.md
            apps/desktop/package.json
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage

      # A dry run keeps the installers for a day, so they can be downloaded and checked.
      - name: Delete artifacts
        if: ${{ !inputs.dry_run }}
        uses: geekyeggo/delete-artifact@v5
        with:
          name: app-*
