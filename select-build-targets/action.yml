name: Select build targets
description: Turn workflow_dispatch checkboxes into a build matrix of the ticked targets.

inputs:
  targets:
    description: "Target ids, such as `mac_arm64, linux_x64`. Each id is also its checkbox name. For a target with no preset, pass a JSON list."
    required: true
  selected:
    description: The run's checkboxes, as toJSON(inputs).
    required: true

outputs:
  matrix:
    description: "The `{ include: [...] }` matrix for fromJSON."
    value: ${{ steps.select.outputs.matrix }}

runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        SELECTED: ${{ inputs.selected }}
      run: node "$GITHUB_ACTION_PATH/select-build-targets.mjs"
